name: Build

on:
  push:
    branches: [main, app]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (ARM64)
          - os: ubuntu-24.04
            name: Linux (x64)
          - os: windows-latest
            name: Windows (x64)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install dependencies
        run: bun install

      - name: Build Vite
        run: bun run build:vite

      - name: Build Electrobun
        run: bunx electrobun build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-${{ runner.os }}-${{ runner.arch }}
          path: build/
          retention-days: 30
